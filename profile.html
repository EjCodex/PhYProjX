<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouFoundGa • Profile</title>
<link rel="icon" href="logo.png">
<style>
:root{--brand:#c20e0e;--brand-dark:#9f0c0c;--bg:#f4f4f4;--text:#111;--muted:#6b6b6b;--white:#fff;--shadow:0 10px 22px rgba(0,0,0,.15)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#efefef;color:var(--text)}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,#d01818, #9f0c0c);color:#fff;padding:18px 16px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.brand span{font-size:20px;font-weight:700}
.profile-mini{display:flex;align-items:center;gap:10px}
.profile-mini .avatar{width:36px;height:36px;border-radius:50%;background:#eee}
.nav{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.nav a{background:#fff;color:#111;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.sidebar-footer{margin-top:auto;color:#fff;display:flex;flex-direction:column;gap:18px;padding:12px 2px}
.content{padding:26px;background:#f1f1f1}
.header{display:flex;align-items:center;gap:20px;margin:12px 0 8px 0}
.avatar-xl{width:140px;height:140px;border-radius:50%;object-fit:cover;box-shadow:0 10px 22px rgba(0,0,0,.15)}
.name{font-size:36px;font-weight:800}
.id{color:#444;font-weight:700;letter-spacing:.08em}
.stats{display:flex;gap:30px;margin:10px 0 20px 160px}
.stat{font-weight:800}
.divider{height:1px;background:#ddd;margin:12px 0}
.card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px}
.item-header{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:12px}
.item-thumb{width:96px;height:96px;border-radius:12px;object-fit:cover;background:#ddd}
.item-title{display:inline-block;background:#efefef;border-radius:999px;padding:8px 14px;font-weight:800}
.meta{font-size:12px;color:#666}
.location{margin:8px 0 2px 0;font-weight:700}
.desc{border:1px solid #eee;border-radius:12px;background:#fafafa;padding:12px;min-height:90px}
.actions{display:flex;gap:12px;margin-top:12px}
.btn-found{background:#16a34a;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:800}
.btn-comments{background:#b20f0f;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:800}
@media (max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:0;flex-direction:row;align-items:center}.stats{margin-left:0;flex-wrap:wrap}}

/* Login modal */
.pill{background:#fff;color:#111;border:none;border-radius:9999px;padding:10px 22px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.18);cursor:pointer}
.pill.login{background:var(--brand);color:#fff}
.pill.login:hover{background:var(--brand-dark)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-overlay.open{display:flex}
.login-card{background:#fff;border-radius:26px;max-width:760px;width:min(92vw,760px);box-shadow:0 22px 46px rgba(0,0,0,.28);padding:26px 22px 30px}
.login-card .logo-wrap{display:flex;justify-content:center;margin:12px 0 8px}
.login-card .logo{width:120px;height:120px;object-fit:cover;background:#fff;border-radius:50%;box-shadow:0 10px 22px rgba(0,0,0,.12);padding:14px}
.login-card h3{text-align:center;font-size:28px;letter-spacing:.02em;margin:12px 0 18px 0}
.login-form{display:flex;flex-direction:column;gap:12px;align-items:stretch;padding:0 18px 6px}
.login-input{width:100%;border-radius:10px;border:1px solid #dedede;background:#f7f7f7;padding:12px 14px;font-size:15px}
.login-input:focus{outline:2px solid #0000001f;border-color:#c8c8c8;background:#fff}
.login-submit{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.login-submit:hover{background:var(--brand-dark)}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <img src="Lost and found with red background white.png" alt="logo">
      <span>YouFoundGa</span>
    </div>
    <div class="profile-mini">
      <div class="avatar"></div>
      <div>
        <div style="font-weight:700">User</div>
        <div style="font-size:12px;opacity:.8">Status</div>
      </div>
    </div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="lost.html">Lost Items</a>
      <a href="found.html">Found Items</a>
    </nav>
    <div class="sidebar-footer">
      
      <div><a href="settings.html#logout" style="color:#fff;text-decoration:none">Logout</a></div>
    </div>
  </aside>

  <main class="content">
    <div class="header">
      <img class="avatar-xl" src="user-icon-on-transparent-background-free-png.webp" alt="User avatar">
      <div>
        <div class="name">User</div>
        <div class="id">123456</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat">1 Connection\s</div>
      <div class="stat">20 Share\s</div>
      <div class="stat">1 Found\s</div>
    </div>
    <div class="divider"></div>
    <div style="margin:16px 0 0 160px">
      <button class="pill login" id="openLogin">Login</button>
    </div>
  </main>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal-overlay" aria-hidden="true">
  <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="logo-wrap">
      <img src="YouFoundGa.png" alt="YouFoundGa" class="logo">
    </div>
    <h3 id="loginTitle">Sign In</h3>
    <form class="login-form" onsubmit="return false;">
      <input type="text" class="login-input" placeholder="Student ID Number" inputmode="numeric" autocomplete="username">
      <input type="password" class="login-input" placeholder="Password" autocomplete="current-password">
      <button class="login-submit" type="submit">Login</button>
    </form>
  </div>
  
</div>
<script>
(function(){
  const modal = document.getElementById('loginModal');
  const openBtn = document.getElementById('openLogin');
  if(!modal || !openBtn) return;
  function open(){modal.classList.add('open');modal.setAttribute('aria-hidden','false');}
  function close(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');}
  openBtn.addEventListener('click', open);
  modal.addEventListener('click', (e)=>{ if(e.target === modal) close(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') close(); });
})();
</script>
</body>
</html>
